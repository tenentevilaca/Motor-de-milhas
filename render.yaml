services:
  - type: web
    name: motor-de-milhas
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCHEDULE_TIMEZONE
        value: America/Sao_Paulo
      - key: SCHEDULE_CRON_MAIN
        value: 0 6,13,21 * * *
      - key: SCHEDULE_CRON_FLASHSALE
        value: 0 */2 * * *
      - key: SCHEDULE_CRON_DEALFEED
        value: "*/10 * * * *"
      - key: DEAL_FEED_URLS
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: KIWI_TEQUILA_API_KEY
        sync: false
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: CALLMEBOT_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
    # Nota: o plano "free" do Render não suporta disco persistente. Os dados
    # em ./data (buscas salvas, histórico de preços, e as chaves que você
    # colar na tela de Configurações) serão perdidos a cada deploy/restart
    # nesse plano. No free tier, prefira preencher as chaves acima como
    # variáveis de ambiente do Render (que persistem de verdade) em vez de
    # usar a tela de Configurações. Para a tela de Configurações persistir,
    # migre para um plano pago com "disk" ou troque o storage por um banco
    # externo.
